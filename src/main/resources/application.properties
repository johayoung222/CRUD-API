#spring.datasource.driver-class-name=com.tmax.tibero.jdbc.TbDriver
#spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect

# \uacf5\ud1b5 \uc811\uc18d \uc815\ubcf4
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ================================================================================
# Data Access Layer Configuration
# JPA \ub610\ub294 MyBatis \uc120\ud0dd
# ================================================================================
# \uc0ac\uc6a9\ud560 \ub370\uc774\ud130 \uc561\uc138\uc2a4 \uacc4\uce35 \uc120\ud0dd: JPA \ub610\ub294 MYBATIS
app.data-access.type=JPA
# app.data-access.type=MYBATIS

# ================================================================================
# JPA Configuration
# ================================================================================
# ddl-auto: \ud14c\uc774\ube14 \uc790\ub3d9 \uc0dd\uc131 \uc0ac\uc6a9 \uc548\ud568 (validate \ub610\ub294 none \uad8c\uc7a5)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ================================================================================
# MyBatis Configuration
# ================================================================================
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.example.crudapi.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.default-fetch-size=100
mybatis.configuration.default-statement-timeout=30

# ================================================================================
# Logging Configuration
# ================================================================================
logging.level.org.springframework.web=INFO
logging.level.com.example.crudapi=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# MyBatis SQL \ub85c\uae45
logging.level.com.example.crudapi.repository.mybatis=DEBUG

# ================================================================================
# Actuator Configuration (Health Check)
# ================================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ================================================================================
# Redis Configuration
# ================================================================================
spring.data.redis.host=${REDIS_HOST:192.168.1.55}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# ================================================================================
# Session Configuration
# ================================================================================
# Spring Session을 Redis에 저장
spring.session.store-type=redis
spring.session.redis.namespace=spring:session
spring.session.timeout=30m
