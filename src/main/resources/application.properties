# ================================================================================
# Application Configuration
# ================================================================================
spring.application.name=crud-api
server.port=8080

# ================================================================================
# Database Connection Configuration
# DB \uc811\uc18d \uc815\ubcf4 (\uacf5\ud1b5 \uc124\uc815)
# ================================================================================
# \uc544\ub798 \uac12\ub4e4\uc744 \uc2e4\uc81c DB \uc11c\ubc84 \uc815\ubcf4\ub85c \ubcc0\uacbd\ud558\uc138\uc694
DB_HOST=${DB_HOST:192.168.1.55}
DB_PORT=${DB_PORT:5432}
DB_NAME=${DB_NAME:cruddb}
DB_USERNAME=${DB_USERNAME:cruduser}
DB_PASSWORD=${DB_PASSWORD:crudpass123}

# ================================================================================
# Database Driver Configuration
# \uc0ac\uc6a9\ud560 DB\uc5d0 \ub9de\uac8c \ud558\ub098\ub97c \uc120\ud0dd\ud558\uc138\uc694 (\uc8fc\uc11d \ud574\uc81c)
# ================================================================================

# ----- PostgreSQL -----
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

